<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --primary: #22c55e;
        --secondary: #16a34a;
        --emerald: #10b981;
        --bg: #0f172a;
        --text: #f8fafc;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.85rem;
      }

      .logo {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo svg {
        width: 24px;
        height: 24px;
        fill: white;
      }

      h2 {
        margin: 0;
        font-size: 1.2rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .status-card {
        background: rgba(30, 41, 59, 0.7);
        padding: 0.7rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 1rem;
      }

      .stat-label {
        color: #94a3b8;
        font-size: 0.65rem;
      }

      .stat-value {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--primary);
      }

      .protection-summary,
      .protection-toggle,
      .protection-mode-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .blocked-summary,
      .protection-mode-copy {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 6px;
      }

      .protection-toggle {
        color: #cbd5e1;
        font-size: 0.68rem;
      }

      .protection-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 8px;
      }

      .settings-btn.protection-action {
        min-width: 0;
        padding: 6px;
        font-size: 0.68rem;
      }

      .protection-mode-row {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .protection-mode-copy {
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        color: #cbd5e1;
        font-size: 0.68rem;
      }

      .undo-section {
        display: none;
        margin-top: 7px;
        padding: 6px 7px;
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 7px;
        background: rgba(16, 185, 129, 0.1);
        animation: slideIn 0.3s ease;
      }

      .toggle-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 1rem;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 20px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #334155;
        transition: 0.4s;
        border-radius: 34px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .slider.global {
        background-color: var(--primary);
      }

      input:checked + .slider.friendly {
        background-color: var(--emerald);
      }

      input:checked + .slider:before {
        transform: translateX(18px);
      }

      .footer {
        margin-top: 1rem;
        text-align: center;
        color: #64748b;
        font-size: 0.75rem;
      }

      .settings-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--text);
        transition: all 0.2s ease;
      }

      .settings-btn:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
      }

      .settings-btn:active {
        transform: translateY(0);
      }

      .mode-select {
        min-width: 86px;
        padding: 5px 7px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        background: #1e293b;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .media-card {
        background: rgba(30, 41, 59, 0.55);
        border: 1px solid rgba(96, 165, 250, 0.2);
        border-radius: 14px;
        padding: 0.85rem;
        margin-bottom: 1rem;
      }

      .media-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.55rem;
      }

      .media-count {
        color: #60a5fa;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .media-status {
        color: #64748b;
        font-size: 0.68rem;
        line-height: 1.35;
      }

      .media-helper-action {
        margin-top: 8px;
      }

      .media-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 230px;
        overflow-y: auto;
      }

      .media-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 8px;
        align-items: start;
        padding: 7px;
        background: rgba(15, 23, 42, 0.75);
        border-radius: 8px;
      }

      .media-kind {
        padding: 3px 5px;
        border-radius: 5px;
        color: #bfdbfe;
        background: rgba(59, 130, 246, 0.18);
        font-size: 0.58rem;
        font-weight: 800;
      }

      .media-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 3px;
      }

      .media-name {
        overflow: hidden;
        color: #cbd5e1;
        font-size: 0.68rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .media-details {
        overflow: hidden;
        color: #60a5fa;
        font-size: 0.61rem;
        line-height: 1.35;
        text-overflow: ellipsis;
      }

      .media-download {
        align-self: center;
        padding: 5px 7px;
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 6px;
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
        font: inherit;
        font-size: 0.58rem;
        font-weight: 800;
        cursor: pointer;
      }

      .media-download-control {
        display: flex;
        max-width: 124px;
        flex-direction: column;
        gap: 4px;
      }

      .media-download-profile {
        width: 124px;
        padding: 4px 5px;
        overflow: hidden;
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 6px;
        background: #172033;
        color: #bfdbfe;
        font: inherit;
        font-size: 0.58rem;
        text-overflow: ellipsis;
        cursor: pointer;
      }

      .media-download-profile:disabled {
        color: #94a3b8;
        cursor: default;
        opacity: 0.78;
      }

      .media-download-estimate {
        width: 124px;
        overflow: hidden;
        color: #93c5fd;
        font-size: 0.56rem;
        line-height: 1.25;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .media-player-output-diagnostic {
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .media-download:disabled {
        border-color: rgba(148, 163, 184, 0.14);
        background: rgba(148, 163, 184, 0.06);
        color: #64748b;
        cursor: not-allowed;
      }

      .media-actions {
        display: flex;
        align-self: center;
        flex-direction: column;
        gap: 4px;
      }

      .media-debug-save {
        border-color: rgba(96, 165, 250, 0.32);
        background: rgba(59, 130, 246, 0.12);
        color: #bfdbfe;
        white-space: nowrap;
      }

      .media-job-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      .media-job {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 6px;
        background: rgba(30, 41, 59, 0.7);
        border-radius: 8px;
      }

      .media-job-terminal {
        padding: 5px 6px;
        background: rgba(30, 41, 59, 0.48);
      }

      .media-job-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 3px;
      }

      .media-job-actions {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .media-job-action {
        min-width: 0;
        padding: 3px 5px;
        font-size: 0.52rem;
      }

      .media-job-error {
        grid-column: 1 / -1;
        max-height: 150px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        padding: 6px;
        border: 1px solid rgba(248, 113, 113, 0.18);
        border-radius: 6px;
        background: rgba(127, 29, 29, 0.14);
        color: #fecaca;
        font:
          0.58rem/1.45 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }

      .media-job-status-completed {
        color: #86efac;
      }

      .media-job-status-failed,
      .media-job-status-cancelled {
        color: #fca5a5;
      }

      .media-cancel {
        border-color: rgba(248, 113, 113, 0.3);
        background: rgba(248, 113, 113, 0.1);
        color: #fca5a5;
      }

      .media-manager-link {
        width: 100%;
        margin-top: 8px;
        border-color: rgba(96, 165, 250, 0.28);
        background: rgba(59, 130, 246, 0.1);
        color: #93c5fd;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" />
        </svg>
      </div>
      <div>
        <h2>AdsFriendly</h2>
        <span style="font-size: 0.7rem; color: #64748b"
          >v2.2 · Product build</span
        >
      </div>
    </div>

    <div class="status-card">
      <div class="protection-summary">
        <div class="blocked-summary">
          <span class="stat-value" id="blocked-count">0</span>
          <span class="stat-label">Ads blocked</span>
        </div>
        <div class="protection-toggle">
          <span>Protection</span>
          <label class="switch" title="General protection">
            <input type="checkbox" checked id="status-toggle" />
            <span class="slider global"></span>
          </label>
        </div>
      </div>

      <div class="protection-actions">
        <button
          class="settings-btn protection-action"
          id="magic-wand-btn"
          title="Select an element to hide with Magic Wand"
          style="
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed rgba(16, 185, 129, 0.4);
          "
        >
          Magic Wand
        </button>
        <button
          class="settings-btn protection-action"
          id="reset-rules-btn"
          title="Reset hidden element rules for this site"
          style="
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
          "
        >
          Reset site
        </button>
      </div>

      <div id="undo-section" class="undo-section">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <span style="font-size: 0.7rem; color: #10b981"
            >Removed something by mistake?</span
          >
          <button
            id="undo-btn"
            style="
              background: #10b981;
              color: white;
              border: none;
              padding: 4px 8px;
              border-radius: 4px;
              cursor: pointer;
              font-size: 0.7rem;
              font-weight: bold;
            "
          >
            Restore
          </button>
        </div>
      </div>

      <div class="protection-mode-row">
        <div class="protection-mode-copy">
          <span>Protection Mode</span>
          <span id="mode-description" style="font-size: 0.6rem; color: #64748b"
            >Safe rules only</span
          >
        </div>
        <select
          id="protection-mode-select"
          class="mode-select"
          aria-label="Protection mode"
        >
          <option value="safe">Safe</option>
          <option value="assist">Assist</option>
          <option value="auto">Auto</option>
        </select>
      </div>
    </div>

    <section class="media-card" id="media-card" aria-live="polite">
      <div class="media-card-header">
        <span style="font-size: 0.78rem; font-weight: 700">Media detected</span>
        <span class="media-count" id="media-count">0</span>
      </div>
      <div class="media-status" id="media-status">
        Open a video page in Assist mode to test detection.
      </div>
      <button
        class="media-download media-helper-action"
        id="media-helper-action"
        type="button"
        hidden
      >
        Allow helper connection
      </button>
      <div class="media-list" id="media-list" hidden></div>
      <div class="media-job-list" id="media-job-list" hidden></div>
      <button
        class="media-download media-manager-link"
        id="media-manager-link"
        type="button"
        hidden
      >
        Open Download Manager
      </button>
    </section>

    <button
      id="settings-btn"
      style="
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
        padding: 0.5rem;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      "
    >
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
        />
      </svg>
      Rules & Blacklist
    </button>

    <div class="footer">Intelligent protection for a better web.</div>

    <script src="popup.js"></script>
  </body>
</html>
