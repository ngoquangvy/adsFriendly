<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdsFriendly Media Download</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --card: rgba(15, 23, 42, 0.92);
        --line: rgba(148, 163, 184, 0.18);
        --text: #f8fafc;
        --muted: #94a3b8;
        --blue: #60a5fa;
        --green: #22c55e;
        --red: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 18px;
        background:
          radial-gradient(circle at top, #172554 0, transparent 38%), var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        width: min(720px, 100%);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.55rem;
      }

      .lead,
      .hint {
        color: var(--muted);
        line-height: 1.5;
      }

      .card {
        margin-top: 22px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      }

      .source {
        overflow: hidden;
        margin-bottom: 18px;
        color: var(--blue);
        font-size: 0.9rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 7px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      select,
      button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #111c30;
        color: var(--text);
        font: inherit;
      }

      button {
        padding: 0 18px;
        cursor: pointer;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      #start-button {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.16);
        color: #86efac;
      }

      #cancel-button {
        color: #fca5a5;
      }

      .status {
        min-height: 24px;
        margin: 18px 0 8px;
        color: var(--muted);
        line-height: 1.45;
      }

      .status.error {
        color: var(--red);
      }

      .status.success {
        color: var(--green);
      }

      progress {
        width: 100%;
        height: 12px;
        accent-color: var(--green);
      }

      .metrics {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.75rem;
      }

      @media (max-width: 540px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HLS download</h1>
      <div class="lead">
        Segments are fetched concurrently and written in playlist order.
      </div>

      <section class="card">
        <div class="source" id="source">Loading download job…</div>
        <div class="controls">
          <label id="quality-field" hidden>
            Quality
            <select id="quality-select"></select>
          </label>
          <label>
            Parallel connections
            <select id="concurrency-select">
              <option value="4">4 · conservative</option>
              <option value="8">8 · balanced</option>
              <option value="12">12 · fast</option>
              <option value="16">16 · maximum</option>
            </select>
          </label>
        </div>

        <div class="status" id="status">Preparing manifest…</div>
        <progress id="progress" value="0" max="1"></progress>
        <div class="metrics">
          <span id="resource-progress">0 / 0 resources</span>
          <span id="speed">0 MB · 0 MB/s</span>
        </div>

        <div class="actions">
          <button id="start-button" disabled>Choose file & download</button>
          <button id="cancel-button" disabled>Cancel</button>
        </div>
        <p class="hint">
          Initial support: unencrypted HLS VOD with muxed audio/video. Live,
          separate audio, DRM, and discontinuities are intentionally blocked.
        </p>
      </section>
    </main>
    <script src="download.js"></script>
  </body>
</html>
