workflows:
  ios-build:
    name: AdsFriendly iOS
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_SCHEME: "AdsFriendly_iOS"
        BUNDLE_ID: "com.vyngo.AdsFriendly-iOS"
    scripts:
      - name: Build iOS
        script: |
          cd $CM_BUILD_DIR/ios/AdsFriendly_iOS
          xcodebuild build \
            -project AdsFriendly_iOS.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            | xcpretty
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - vyngo@users.noreply.github.com
        notify:
          success: true
          failure: true
