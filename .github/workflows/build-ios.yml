name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA for device
        run: |
          cd ios/AdsFriendly_iOS
          xcodebuild -project AdsFriendly_iOS.xcodeproj \
            -scheme AdsFriendly_iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          # Locate .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdsFriendly_iOS.app" -path "*/Debug-iphoneos/*" | head -1)
          echo "App found at: $APP_PATH"

          # Create IPA structure
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build
          zip -r build/AdsFriendly_iOS.ipa Payload/
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdsFriendly-iOS
          path: ios/AdsFriendly_iOS/build/AdsFriendly_iOS.ipa
