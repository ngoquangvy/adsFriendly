name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA for device
        if: ${{ secrets.APPLE_CERTIFICATE == '' }}
        run: |
          cd ios/AdsFriendly_iOS
          xcodebuild -project AdsFriendly_iOS.xcodeproj \
            -scheme AdsFriendly_iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          # Locate .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AdsFriendly_iOS.app" -path "*/Debug-iphoneos/*" | head -1)
          echo "App found at: $APP_PATH"

          # Create IPA structure
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build
          zip -r build/AdsFriendly_iOS.ipa Payload/
          rm -rf Payload

      - name: Create signed IPA (when certs provided)
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > certificate.p12
          echo "${{ secrets.APPLE_PROFILE }}" | base64 --decode > profile.mobileprovision

          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          cd ios/AdsFriendly_iOS
          python3 -c "
import plistlib
with open('ExportOptions.plist', 'wb') as f:
    plistlib.dump({'method': 'development', 'signingStyle': 'manual'}, f, fmt=plistlib.FMT_XML)
          "

          xcodebuild -project AdsFriendly_iOS.xcodeproj \
            -scheme AdsFriendly_iOS \
            -sdk iphoneos \
            -configuration Release \
            -archivePath AdsFriendly.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath AdsFriendly.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdsFriendly-iOS
          path: ios/AdsFriendly_iOS/build/AdsFriendly_iOS.ipa
