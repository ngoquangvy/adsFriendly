name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios/**
      - product/**

permissions:
  contents: read

concurrency:
  group: ios-basic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install build tools
        run: pnpm install --frozen-lockfile
      - name: Validate iOS before compiling
        run: |
          set -euo pipefail
          pnpm ios:check
          pnpm ios:settings:check
          pnpm test:ios
          plutil -lint ios/AdsFriendly_iOS/AdsFriendly_iOS.xcodeproj/project.pbxproj
      - name: Browser smoke checks
        env:
          AF_IOS_CPU_THROTTLE: "4"
        run: pnpm test:ios:browser
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Native iOS tests (media, DNS and WebKit protection)
        timeout-minutes: 12
        working-directory: ios/AdsFriendly_iOS
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')"
          xcodebuild test -project AdsFriendly_iOS.xcodeproj \
            -scheme AdsFriendly_iOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath build/NativeTests.xcresult \
            -only-testing:AdsFriendly_iOSTests CODE_SIGNING_ALLOWED=NO
      - name: Export native download UI previews
        if: always()
        continue-on-error: true
        working-directory: ios/AdsFriendly_iOS
        run: |
          if test -d build/NativeTests.xcresult; then
            xcrun xcresulttool export attachments --path build/NativeTests.xcresult --output-path build/NativeScreens
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AdsFriendly-iOS-UI
          path: ios/AdsFriendly_iOS/build/NativeScreens
          if-no-files-found: warn
          retention-days: 14
      - name: Build unsigned IPA for Sideloadly
        working-directory: ios/AdsFriendly_iOS
        run: |
          set -euo pipefail
          xcodebuild -project AdsFriendly_iOS.xcodeproj \
            -scheme AdsFriendly_iOS \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION=1.5.3 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/AdsFriendly_iOS.app"
          test -d "$APP_PATH"
          EXT_PATH="$APP_PATH/PlugIns/AdsFriendly_iOS Extension.appex"
          test -f "$EXT_PATH/utils/shared.js"
          test -f "$EXT_PATH/packages/import.html"
          test -f "$EXT_PATH/packages/default-settings-package.json"
          test -f "$EXT_PATH/packages/advertising-rules.json"
          test -f "$APP_PATH/DNS.js"
          test -f "$APP_PATH/AdsFriendly-Default-DNS.mobileconfig"
          test -f "$APP_PATH/mobile-modules.json"
          python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); assert c["profile"] == "full"; assert "media" in [m["id"] for m in c["modules"]]' "$APP_PATH/mobile-modules.json"
          for binary in "$APP_PATH/AdsFriendly_iOS" "$APP_PATH"/*.dylib; do
            if test -f "$binary"; then nm "$binary" >> build/basic-symbols.txt; fi
          done
          if grep -E 'YouTubeKit|YouTubeSourceResolver|YouTubeDownloadStore|YouTubeDownloadsViewController' build/basic-symbols.txt; then
            echo "YouTube code leaked into the basic edition"; exit 1
          fi
          if find "$APP_PATH" -name '*YouTubeKit*' | grep .; then
            echo "YouTube dependency resource leaked into the basic edition"; exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r AdsFriendly_iOS.ipa Payload/
      - name: Compile without media and verify composition
        working-directory: ios/AdsFriendly_iOS
        run: |
          set -euo pipefail
          trap 'node ../../scripts/mobile-config.mjs' EXIT
          AF_MOBILE_PROFILE=protection node ../../scripts/mobile-config.mjs
          xcodebuild -project AdsFriendly_iOS.xcodeproj \
            -scheme AdsFriendly_iOS -sdk iphoneos -configuration Debug \
            -derivedDataPath build/ProtectionOnly \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG AF_PROTECTION_ONLY' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          CORE_APP="build/ProtectionOnly/Build/Products/Debug-iphoneos/AdsFriendly_iOS.app"
          python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); assert c["profile"] == "protection"; assert [m["id"] for m in c["modules"]] == ["protection"]; assert not c["directFormats"]' "$CORE_APP/mobile-modules.json"
          for binary in "$CORE_APP/AdsFriendly_iOS" "$CORE_APP"/*.dylib; do
            if test -f "$binary"; then nm "$binary" >> build/protection-symbols.txt; fi
          done
          if grep -E 'MobileDownloadStore|MobileSourceProbe|MobileDownloadsViewController' build/protection-symbols.txt; then
            echo "Unexpected media implementation in protection-only app"; exit 1
          fi
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdsFriendly-iOS
          path: ios/AdsFriendly_iOS/build/AdsFriendly_iOS.ipa
          if-no-files-found: error
          retention-days: 14
