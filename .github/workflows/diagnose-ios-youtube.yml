name: Diagnose iOS YouTube provider
on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths:
      - "ios/AdsFriendly_iOS/YouTubeEdition/Tools/ProviderProbe/**"
      - ".github/workflows/diagnose-ios-youtube.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Native provider diagnostic (public fixture, no source tokens)
        run: swift run --package-path ios/AdsFriendly_iOS/YouTubeEdition/Tools/ProviderProbe ProviderProbe
