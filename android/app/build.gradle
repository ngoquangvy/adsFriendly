plugins { id 'com.android.application' }
android {
    namespace 'com.adsfriendly.mobile'
    compileSdk 36
    defaultConfig { applicationId 'com.adsfriendly.mobile'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0' }
    flavorDimensions 'modules'
    productFlavors { full { dimension 'modules' }; protection { dimension 'modules'; applicationIdSuffix '.core' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation project(':core')
    fullImplementation project(':media-downloads')
}
